[tool.poetry]
name = "resume_website"
version = "1.0.5"
description = "Resume Website"
authors = ["Matteo De Ponti <teo@maculade.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
Babel = "^2.12.1"
click = "^8.1.3"
Flask = "^3.1"
flask-babel = ">=3.0.1,<5.0.0"
Flask-Cors = "^6.0"
Flask-Session = "^0.8"
gunicorn = ">=22,<27"
isort = ">=5.12,<9.0"
pytest = "^9.0"
requests = "^2.31.0"
selenium = "^4.8.2"
black = "^26.3"
flake8 = ">=6,<8"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
